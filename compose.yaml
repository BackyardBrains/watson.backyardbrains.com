services:
  watson-api:
    build: .
    image: byb-watson:standalone
    container_name: watson-api
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      GIT_SHA: ${WATSON_GIT_SHA:-unknown}
      GIT_BRANCH: main
      DATA_PATH: /data
      USE_MEMORY_API: "true"
      MEMORY_API_URL: https://memory.backyardbrains.com
    volumes:
      - /var/lib/byb/watson-runtime:/data
      - /var/lib/byb/corpus:/corpus:rw
